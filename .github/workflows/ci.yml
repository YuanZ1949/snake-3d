name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install "websockets<16"

      - name: Unit tests (test_game.py)
        run: python test_game.py

      # ---- 7 套 websocket/python E2E ----
      - name: Start WS servers (28000 / 8090)
        run: |
          PORT=28000 python serve.py > /tmp/serve_28000.log 2>&1 &
          PORT=8090 python serve.py > /tmp/serve_8090.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:28000/ > /dev/null
          curl -sf http://127.0.0.1:8090/ > /dev/null
          echo "both servers up"

      - name: "E2E (round 1: test_ws / test_ws2)"
        run: |
          python test_ws.py
          python test_ws2.py

      - name: "E2E (round 2: rooms / p1 / bots / reconnect / pass)"
        run: |
          python verify_rooms.py
          python test_p1.py
          python test_bots_p4.py
          python test_reconnect_p5.py
          python test_pass_p6.py

      - name: Stop WS servers
        if: always()
        run: |
          pkill -f "serve.py" || true
          rm -f data/persist_rooms.json

      # ---- Playwright 冒烟（8123 静态起服） ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start game server (8123)
        run: |
          PORT=8123 python serve.py > /tmp/serve_8123.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:8123/index.html > /dev/null
          echo "8123 up"

      - name: Playwright smoke
        run: BASE=http://127.0.0.1:8123 npx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: /tmp/serve_*.log
          retention-days: 7
          if-no-files-found: ignore
